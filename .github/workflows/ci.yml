name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: tests (bootstrap fixed point, check, run, kek test, fmt, difftest, e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          cache: true
      - uses: actions/cache@v4
        with:
          path: lean/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json', 'lean/**/*.lean') }}
          restore-keys: lake-${{ runner.os }}-
      - run: mise run lean
      - run: tests/run.sh --short
      - run: mise run fmt-check
