name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: tests (bootstrap fixed point, check, run, e2e, difftest, fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          install_args: node
          cache: true
      - run: node tests/run.mjs --short
      - run: ./kek fmt -check compiler testdata/e2e testdata/run testdata/test examples

  lean:
    name: lean proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          install_args: github:leanprover/lean4
          cache: true
      - uses: actions/cache@v4
        with:
          path: lean/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json', 'lean/**/*.lean') }}
          restore-keys: lake-${{ runner.os }}-
      - run: mise run lean
