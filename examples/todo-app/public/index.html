<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kekkai Todo</title>
<style>
  :root { --fg: #1d1d1f; --muted: #6e6e73; --line: #d2d2d7; --bg: #f5f5f7; --card: #fff; --accent: #b4232a; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #f5f5f7; --muted: #a1a1a6; --line: #3a3a3c; --bg: #111; --card: #1c1c1e; --accent: #ff6b6b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
  main { max-width: 32rem; margin: 3rem auto; padding: 0 1rem; }
  h1 { font-size: 1.5rem; margin: 0 0 1.5rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 1.25rem; }
  form { display: flex; gap: .5rem; flex-wrap: wrap; }
  input[type=text], input[type=password] { flex: 1 1 10rem; padding: .55rem .7rem; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; font: inherit; }
  button { padding: .55rem 1rem; border: 0; border-radius: 8px; background: var(--fg); color: var(--bg); font: inherit; cursor: pointer; }
  button.link { background: none; color: var(--muted); padding: 0; text-decoration: underline; }
  .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; color: var(--muted); }
  ul { list-style: none; margin: 1rem 0 0; padding: 0; }
  li { display: flex; align-items: center; gap: .6rem; padding: .5rem 0; border-top: 1px solid var(--line); }
  li span { flex: 1; overflow-wrap: anywhere; }
  li.done span { color: var(--muted); text-decoration: line-through; }
  li button { background: none; color: var(--muted); padding: .2rem .4rem; }
  .error { color: var(--accent); min-height: 1.5em; margin: .5rem 0 0; }
  .empty { color: var(--muted); margin: 1rem 0 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>結界 Todo</h1>

  <section id="auth" class="card" hidden>
    <form id="auth-form">
      <input type="text" name="username" placeholder="username" autocomplete="username" required>
      <input type="password" name="password" placeholder="password (8+)" autocomplete="current-password" required>
      <button type="submit" data-action="login">ログイン</button>
      <button type="submit" data-action="signup">新規登録</button>
    </form>
    <p class="error" id="auth-error"></p>
  </section>

  <section id="app" class="card" hidden>
    <div class="row"><span id="who"></span><button class="link" id="logout">ログアウト</button></div>
    <form id="add-form">
      <input type="text" name="title" placeholder="やること" maxlength="200" required>
      <button type="submit">追加</button>
    </form>
    <p class="error" id="app-error"></p>
    <ul id="list"></ul>
    <p class="empty" id="empty" hidden>まだ何もありません</p>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);

async function api(method, path, data) {
  const init = { method, credentials: "same-origin" };
  if (data) {
    init.body = JSON.stringify(data);
    init.headers = { "content-type": "application/json" };
  }
  const r = await fetch("/api" + path, init);
  const text = await r.text();
  const body = text ? JSON.parse(text) : null;
  if (!r.ok) throw new Error(body?.error ?? r.statusText);
  return body;
}

function show(user) {
  $("auth").hidden = !!user;
  $("app").hidden = !user;
  if (user) {
    $("who").textContent = user.username + " としてログイン中";
    refresh();
  }
}

async function refresh() {
  try { render(await api("GET", "/todos")); }
  catch (e) { if (e.message === "not signed in") show(null); else $("app-error").textContent = e.message; }
}

function render(todos) {
  const list = $("list");
  list.replaceChildren(...todos.map((t) => {
    const li = document.createElement("li");
    li.className = t.done ? "done" : "";
    const box = document.createElement("input");
    box.type = "checkbox";
    box.checked = t.done;
    box.onchange = () => act(() => api("POST", `/todos/${t.id}/toggle`));
    const span = document.createElement("span");
    span.textContent = t.title;
    const del = document.createElement("button");
    del.textContent = "✕";
    del.title = "削除";
    del.onclick = () => act(() => api("DELETE", `/todos/${t.id}`));
    li.append(box, span, del);
    return li;
  }));
  $("empty").hidden = todos.length > 0;
}

async function act(f) {
  $("app-error").textContent = "";
  try { await f(); } catch (e) { $("app-error").textContent = e.message; }
  refresh();
}

$("auth-form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const action = ev.submitter?.dataset.action ?? "login";
  $("auth-error").textContent = "";
  const form = new FormData(ev.target);
  const data = { username: form.get("username").trim(), password: form.get("password") };
  try { show(await api("POST", "/" + action, data)); ev.target.reset(); }
  catch (e) { $("auth-error").textContent = e.message; }
});

$("add-form").addEventListener("submit", (ev) => {
  ev.preventDefault();
  const title = new FormData(ev.target).get("title").trim();
  act(() => api("POST", "/todos", { title }));
  ev.target.reset();
});

$("logout").onclick = async () => { await api("POST", "/logout").catch(() => {}); show(null); };

api("GET", "/me").then(show, () => show(null));
</script>
</body>
</html>
