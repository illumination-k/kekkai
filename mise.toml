[tools]
wasmtime = "49.0.2"
wasm-tools = "1.261.0"
workerd = "1.20261002.1"
"github:leanprover/lean4" = "4.34.1"

[tasks.test]
description = "Run all tests (bootstrap fixed point, check, run, kek test, agent commands, fmt, difftest, e2e on workerd); args: tests/run.sh --help"
run = "tests/run.sh"

[tasks.difftest]
description = "Differential test against the Lean reference interpreter (mise run lean first; usage: mise run difftest -- -n 500)"
run = "tests/run.sh difftest"

[tasks.lean]
description = "Build and check the Lean formalization"
dir = "lean"
run = "lake build"

[tasks.fmt]
description = "Format Kekkai sources"
run = "./kek fmt -w compiler lib testdata/e2e testdata/run testdata/test examples tests/difftest"

[tasks.fmt-check]
description = "Check that Kekkai sources are formatted"
run = "./kek fmt -check compiler lib testdata/e2e testdata/run testdata/test examples tests/difftest"

[tasks.prelude]
description = "Regenerate compiler/prelude_src.kek from lib/prelude (./kek also does this when it rebuilds the compiler)"
run = "./kek embed-prelude lib/prelude compiler/prelude_src.kek"

[tasks.ci]
description = "Everything CI runs: tests (incl. bootstrap fixed point), format check, Lean proofs"
depends = ["test", "fmt-check", "lean"]

[tasks.e2e]
description = "Run the Workers programs and the store adapter conformance suite on workerd"
run = "tests/run.sh e2e"

[tasks.bootstrap-check]
description = "Rebuild the self-hosted compiler with itself and require a fixed point"
run = "./kek bootstrap-check"

[tasks.bootstrap-update]
description = "Replace bootstrap/kek.wasm with the current self-hosted compiler (after the fixed-point check)"
run = "./kek bootstrap-update"
