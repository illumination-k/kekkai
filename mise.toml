[tools]
wasmtime = "49.0.2"
wasm-tools = "1.261.0"
workerd = "1.20261002.1"
"github:leanprover/lean4" = "4.34.1"

[tasks.test]
description = "Run all tests (bootstrap fixed point, check, run, kek test, agent commands, fmt, difftest, e2e on workerd); args: tests/run.sh --help"
run = "tests/run.sh"

[tasks.difftest]
description = "Differential test against the Lean reference interpreter (mise run lean first; usage: mise run difftest -- -n 500)"
run = "tests/run.sh difftest"

[tasks.lean]
description = "Build and check the Lean formalization"
dir = "lean"
run = "lake build"

[tasks.fmt]
description = "Format Kekkai sources"
run = "./kek fmt -w compiler lib testdata/e2e testdata/run testdata/test examples tests/difftest"

[tasks.fmt-check]
description = "Check that Kekkai sources are formatted"
run = "./kek fmt -check compiler lib testdata/e2e testdata/run testdata/test examples tests/difftest"

[tasks.prelude]
description = "Regenerate compiler/prelude_src.kek and compiler/core_src.kek from lib/prelude and lib/core (./kek also does this when it rebuilds the compiler)"
run = ["./kek embed-prelude lib/prelude compiler/prelude_src.kek", "./kek embed-prelude lib/core compiler/core_src.kek -as core"]

[tasks.ci]
description = "Everything CI runs: tests (incl. bootstrap fixed point), format check, Lean proofs"
depends = ["test", "fmt-check", "lean"]

[tasks.e2e]
description = "Run the Workers programs and the store adapter conformance suite on workerd"
run = "tests/run.sh e2e"

[tasks.bootstrap-check]
description = "Rebuild the self-hosted compiler with itself and require a fixed point"
run = "./kek bootstrap-check"

[tasks.bootstrap-update]
description = "Replace bootstrap/kek.wasm with the current self-hosted compiler (after the fixed-point check)"
run = "./kek bootstrap-update"

[tasks.dev]
description = "Build a #[handler] program and serve it locally on workerd (usage: mise run dev -- examples/todo/todo.kek)"
run = "scripts/dev.sh"

[tasks.todo-app]
description = "Serve examples/todo-app (frontend + Kekkai API with accounts) on http://127.0.0.1:8787"
run = "ASSETS=examples/todo-app/public OUT=out/todo-app scripts/dev.sh examples/todo-app/server"

[tasks.todo-app-check]
description = "Tests of examples/todo-app and its assurance ledger (kek assure check)"
dir = "examples/todo-app"
run = ["../../kek test server", "../../kek assure check server"]

[tasks.hooks]
description = "Install the pre-commit hook that runs kek assure check on the projects a commit touches"
run = "scripts/install-hooks.sh"

[tasks.bench]
description = "Time mutate/test/cover/hash/build cold and warm; with a git ref, compare against it (scripts/bench.sh [ref])"
run = "scripts/bench.sh"
