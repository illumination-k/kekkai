[tools]
go = "1.27.0"
node = "26.7.0"
wasm-tools = "1.261.0"
"github:leanprover/lean4" = "4.34.1"
"npm:wrangler" = "4.147.0"

[tasks.build]
description = "Build the kek compiler"
run = "go build -o bin/kek ./cmd/kek"

[tasks.test]
description = "Run Go tests (unit, golden, e2e on Node)"
run = "go test ./..."

[tasks.lean]
description = "Build and check the Lean formalization"
dir = "lean"
run = "lake build"

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.fmt]
description = "Format Go and Kekkai sources"
run = [
  "gofmt -w cmd internal",
  "go run ./cmd/kek fmt -w testdata/test",
]

[tasks.fmt-check]
description = "Check that Go and Kekkai sources are formatted"
run = [
  "test -z \"$(gofmt -l cmd internal)\" || (gofmt -l cmd internal; exit 1)",
  "go run ./cmd/kek fmt -check testdata/test",
]

[tasks.ci]
description = "Everything CI runs: vet, tests, format check, Lean proofs"
depends = ["vet", "test", "fmt-check", "lean"]
