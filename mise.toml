[tools]
node = "26.7.0"
wasm-tools = "1.261.0"
"github:leanprover/lean4" = "4.34.1"
"npm:wrangler" = "4.147.0"

[tasks.test]
description = "Run all tests with Node and ./kek only (bootstrap fixed point, check, run, e2e, adapters, difftest, fmt, workerd, node:test files); args: node tests/run.mjs --help"
run = "node tests/run.mjs"

[tasks.difftest]
description = "Differential test against the Lean reference interpreter (mise run lean first; usage: mise run difftest -- -n 500)"
run = "node tests/run.mjs difftest"

[tasks.lean]
description = "Build and check the Lean formalization"
dir = "lean"
run = "lake build"

[tasks.fmt]
description = "Format Kekkai sources"
run = "./kek fmt -w compiler testdata/e2e testdata/run testdata/test examples"

[tasks.fmt-check]
description = "Check that Kekkai sources are formatted"
run = "./kek fmt -check compiler testdata/e2e testdata/run testdata/test examples"

[tasks.test-node]
description = "Run the Node tests of the self-hosted toolchain"
run = "node --test 'tests/*.test.mjs'"

[tasks.ci]
description = "Everything CI runs: tests (incl. bootstrap fixed point), format check, Lean proofs"
depends = ["test", "fmt-check", "lean"]

[tasks.e2e]
description = "Run the Node e2e tests and the store adapter conformance suite"
run = "node tests/run.mjs e2e adapters bad-examples"

[tasks.e2e-workers]
description = "Run a compiled program on workerd (wrangler dev --local, local D1 + Durable Objects) and drive it over HTTP"
run = "node tests/run.mjs -v workers"

[tasks.dev]
description = "Build a .kek file and serve it locally with wrangler dev (usage: mise run dev -- examples/todo/todo.kek)"
run = "scripts/dev.sh"

[tasks.bootstrap-check]
description = "Rebuild the self-hosted compiler with itself and require a fixed point"
run = "./kek bootstrap-check"

[tasks.bootstrap-update]
description = "Replace bootstrap/ with the current self-hosted compiler (after the fixed-point check)"
run = "./kek bootstrap-update"
